  const rab = document.getElementById("resetAllBtn");
  if(rab) rab.addEventListener("click",()=>{
    if(confirm("Sara data reset karna hai? Yeh undo nahi ho sakta.")){
      state = freshState(); scheduleSave(); render(); showToast("Data reset ho gaya");
    }
  });

  // CSV import
  const cib = document.getElementById("csvImportBtn");
  const cif = document.getElementById("csvImportFile");
  if(cib && cif) cib.addEventListener("click",()=>cif.click());
  if(cif) cif.addEventListener("change",(e)=>{
    if(e.target.files && e.target.files[0]) handleCsvFile(e.target.files[0]);
    e.target.value = "";
  });
  document.querySelectorAll("[data-csvtarget]").forEach(b=>b.addEventListener("click",()=>{
    if(csvImportState){ csvImportState.target = b.dataset.csvtarget; render(); }
  }));
  document.querySelectorAll("[data-csvmode]").forEach(b=>b.addEventListener("click",()=>{
    if(csvImportState){ csvImportState.mode = b.dataset.csvmode; render(); }
  }));
  const cicf = document.getElementById("csvImportConfirm");
  if(cicf) cicf.addEventListener("click",()=>{
    if(csvImportState && csvImportState.mode==="replace" && !confirm("This will REPLACE existing products for the selected company. Continue?")) return;
    applyCsvImport();
  });
  const cican = document.getElementById("csvImportCancel");
  if(cican) cican.addEventListener("click",()=>{ csvImportState=null; render(); });

  // accordion toggles
  document.querySelectorAll("[data-toggle]").forEach(head=>{
    head.addEventListener("click",()=>{
      const id = head.dataset.toggle;
      state.openSections[id] = !state.openSections[id];
      render();
      try{
        const target = document.querySelector(`[data-accordion="${id}"]`);
        if(target && typeof target.scrollIntoView === "function") target.scrollIntoView({behavior:"smooth", block:"start"});
      }catch(e){ /* scrollIntoView unsupported in this host — non-fatal */ }
    });
  });

  // products
  const addP = document.getElementById("addProductBtn");
  if(addP) addP.addEventListener("click",()=>{
    curCompany().products.push({id:uid(),name:"",category:"",packSize:"",qty:"",mrp:"",distPrice:"",gstPct:"",gstType:"Unknown",
      schemeType:"None",schemePct:"",schemeFlat:"",schemeFreeUnits:"",schemeBuyX:"",schemeGetY:"",scheme:"",retailPrice:""});
    scheduleSave(); render();
  });
  document.querySelectorAll("[data-delp]").forEach(b=>b.addEventListener("click",()=>{
    curCompany().products = curCompany().products.filter(p=>p.id!==b.dataset.delp);
    scheduleSave(); render();
  }));
  document.querySelectorAll("[data-pfield]").forEach(inp=>{
    const evt = inp.tagName==="SELECT" ? "change" : "input";
    inp.addEventListener(evt,()=>{
      const card = inp.closest(".product-card");
      const pid = card.dataset.pid;
      const p = curCompany().products.find(x=>x.id===pid);
      if(!p) return;
      p[inp.dataset.pfield] = inp.value;
      scheduleSave();
      if(inp.dataset.pfield==="schemeType" || inp.dataset.pfield==="gstType"){
        render(); // field set changes (e.g. scheme sub-fields), needs full re-render
      } else {
        syncProductCardCalc(card);
        const tot = document.getElementById("products-totals");
        if(tot) tot.outerHTML = renderProductTotals();
      }
    });
  });

  // simulator margin source toggle
  document.querySelectorAll("[data-marginsrc]").forEach(b=>b.addEventListener("click",()=>{
    curCompany().simulator.marginSource = b.dataset.marginsrc;
    scheduleSave(); render();
  }));

  // score sliders
  document.querySelectorAll("[data-scoreslider]").forEach(sl=>{
    sl.addEventListener("input",()=>{
      curCompany().scores[sl.dataset.scoreslider] = parseInt(sl.value);
      scheduleSave();
      render();
    });
  });

  // meeting mode
  const qs = allQuestions(curCompany());
  const idxKey = state.activeCompany;
  const mn = document.getElementById("meetingNote");
  if(mn) mn.addEventListener("input",()=>{
    const c = curCompany();
    const i = state.meetingIndex[idxKey];
    if(!c.meeting.answers[i]) c.meeting.answers[i]={status:"",note:""};
    c.meeting.answers[i].note = mn.value;
    scheduleSave();
  });
  document.querySelectorAll("[data-mstatus]").forEach(b=>b.addEventListener("click",()=>{
    const c = curCompany();
    const i = state.meetingIndex[idxKey];
    if(!c.meeting.answers[i]) c.meeting.answers[i]={status:"",note:""};
    c.meeting.answers[i].status = b.dataset.mstatus;
    scheduleSave(); render();
  }));
  const mp = document.getElementById("meetingPrev");
  if(mp) mp.addEventListener("click",()=>{ state.meetingIndex[idxKey] = Math.max(0,state.meetingIndex[idxKey]-1); render(); });
  const mnx = document.getElementById("meetingNext");
  if(mnx) mnx.addEventListener("click",()=>{ state.meetingIndex[idxKey] = Math.min(qs.length-1,state.meetingIndex[idxKey]+1); render(); });
  document.querySelectorAll("[data-jumpq]").forEach(b=>b.addEventListener("click",()=>{
    state.meetingIndex[idxKey] = parseInt(b.dataset.jumpq); render();
  }));
  const cqa = document.getElementById("customQAdd");
  if(cqa) cqa.addEventListener("click",()=>{
    const inp = document.getElementById("customQInput");
    if(inp.value.trim()){
      curCompany().meeting.customQuestions.push(inp.value.trim());
      scheduleSave(); render(); showToast("Sawaal add ho gaya");
    }
  });

  // export
  const prb = document.getElementById("printReportBtn");
  if(prb) prb.addEventListener("click", printReport);
  const ecb = document.getElementById("exportCsvBtn");
  if(ecb) ecb.addEventListener("click", exportCsv);
  const ecv2 = document.getElementById("exportCsvV2Btn");
  if(ecv2) ecv2.addEventListener("click", exportProductsCsvV2);
  const ecmp = document.getElementById("exportComparisonCsvBtn");
  if(ecmp) ecmp.addEventListener("click", exportComparisonCsv);
  const ejb = document.getElementById("exportJsonBtn");
  if(ejb) ejb.addEventListener("click", exportJson);
  const jib = document.getElementById("jsonImportBtn");
  const jif = document.getElementById("jsonImportFile");
  if(jib && jif) jib.addEventListener("click",()=>jif.click());
  if(jif) jif.addEventListener("change",(e)=>{
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async ()=>{
      try{
        const parsed = JSON.parse(String(reader.result));
        if(!parsed || typeof parsed!=="object"){ showToast("Invalid backup file"); return; }
        if(!confirm("Restore this backup? This will REPLACE all current data in this browser. This cannot be undone.")) return;
        const fresh = freshState();
        state = Object.assign(fresh, parsed);
        state.c1 = migrateCompany(parsed.c1, "Company 1");
        state.c2 = migrateCompany(parsed.c2, "Company 2");
        if(!state.meetingIndex) state.meetingIndex = {c1:0,c2:0};
        if(!state.openSections) state.openSections = {};
        await migrateInlinePhotos(state.c1); // in case this backup pre-dates split photo storage
        await migrateInlinePhotos(state.c2);
        const photoData = parsed.__photoData || {};
        for(const id of Object.keys(photoData)){
          photoCache.set(id, photoData[id]);
          try{ await savePhotoBlob(id, photoData[id]); }catch(e){ /* stays available in-memory this session at least */ }
        }
        scheduleSave(); render(); showToast("Backup restored"+(Object.keys(photoData).length?` (${Object.keys(photoData).length} photos)`:""));
      }catch(err){ showToast("Could not read backup file: "+err.message); }
    };
    reader.readAsText(file);
  });
}

/* ================= EXPORT FUNCTIONS ================= */
function downloadCsv(rows, filename){
  const csv = rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const blob = new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  showToast("CSV downloaded");
}
function exportProductsCsvV2(){
  const rows = [["Company","Product","Category","Pack Size","Qty","MRP","Listed Distributor Price","GST %","GST Type","Scheme Type","Scheme Value","Retailer Selling Price",
    "Effective Purchase Price","Distributor Margin %","Distributor Markup %","Retailer Margin %","Stock Value (Effective)","Total Distributor GP","Total Retailer GP"]];
  [state.c1,state.c2].forEach(c=>{
    c.products.forEach(p=>{
      const calc = productCalc(p);
      const schemeVal = p.schemeType==="Percentage"?p.schemePct : p.schemeType==="Flat"?p.schemeFlat : p.schemeType==="Free Units"?p.schemeFreeUnits :
        p.schemeType==="Buy X Get Y"? `${p.schemeBuyX}/${p.schemeGetY}` : (p.scheme||"");
      rows.push([c.name,p.name,p.category,p.packSize,p.qty,p.mrp,p.distPrice,p.gstPct,p.gstType||"Unknown",p.schemeType||"None",schemeVal,p.retailPrice,
        calc.effPrice.toFixed(2),calc.distMarginPct.toFixed(2),calc.distMarkupPct.toFixed(2),calc.retMarginPct.toFixed(2),calc.stockValue.toFixed(2),calc.totalDistGP.toFixed(2),calc.totalRetGP.toFixed(2)]);
    });
  });
  downloadCsv(rows,"distributor-products-v2.csv");
}
function exportComparisonCsv(){
  const rows = [["Company","Legal Name","GSTIN","Contact Person","Phone",
    "Investment","Inventory Value (Effective)","Unrepresented Investment","Branding","Registration","Transport","Deposit","GST","Other",
    "District","Territory Type","Territory Tier","Agreement Written","Can Appoint Another","Monthly Target","Quarterly Target","Annual Target","Expected Monthly Sales",
    "Reorder MOQ","Reorder Price","Transport Terms","Damage Policy","Expiry Policy","Unsold Policy","Marketing Support (est value)","Staff Support","Credit Terms","Exit Policy",
    "Document Verification %","Fatal Risk","Risk Level","Weighted Distributor Margin","Weighted Distributor Markup","Score","Final Decision"]];
  [state.c1,state.c2].forEach(c=>{
    const s=companySummary(c), sc=computeScore(c), w=weightedMargins(c.products), d=companyDecision(c);
    const total=num(c.investment.total);
    const nonInv = num(c.investment.branding)+num(c.investment.registration)+num(c.investment.transport)+num(c.investment.deposit)+num(c.investment.gst)+num(c.investment.other);
    const unrep = total>0? Math.max(0,total-w.totalEffCost-nonInv):0;
    const tier = territoryTier(c.territory,c.documents).label;
    rows.push([
      c.name,c.meta.legalName,c.meta.gstin,c.meta.contactPerson,c.meta.phone,
      total,w.totalEffCost.toFixed(2),unrep.toFixed(2),c.investment.branding,c.investment.registration,c.investment.transport,c.investment.deposit,c.investment.gst,c.investment.other,
      c.territory.district,c.territory.type,tier,c.territory.agreementMentions,c.territory.canAppoint,c.target.monthly,c.target.quarterly,c.target.annual,c.simulator.monthlySales,
      c.reorder.moq,c.reorder.price,c.transport.firstOrder,c.returns.breakage,c.returns.expiredReturn,c.returns.unsold,c.marketing.estValue,c.staff.companySalesman,c.credit.terms,c.exit.canCancel,
      docVerificationPct(c), s.hasFatal?"Yes":"No", s.level.label, w.weightedMarginPct.toFixed(2), w.weightedMarkupPct.toFixed(2), sc.total, d.decision
    ]);
  });
  downloadCsv(rows,"distributor-comparison-full-v2.csv");
}
function exportCsv(){
  let rows = [["Company","Product","Category","Pack Size","Qty","MRP","Distributor Price","GST%","Scheme","Retailer Selling Price","Distributor Margin %","Retailer Margin %","Total Stock Value"]];
  [state.c1,state.c2].forEach(c=>{
    c.products.forEach(p=>{
      const calc = productCalc(p);
      rows.push([c.name,p.name,p.category,p.packSize,p.qty,p.mrp,p.distPrice,p.gstPct,p.scheme,p.retailPrice,calc.distMarginPct.toFixed(2),calc.retMarginPct.toFixed(2),calc.stockValue]);
    });
  });
  const csv = rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob([csv],{type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "distributor-comparison-products.csv";
  a.click();
  showToast("CSV downloaded");
}
const SECTION_PRINT_LABELS = {
  meta:"Company Information", investment:"Investment", products:"Products", territory:"Territory",
  target:"Target", reorder:"Reorder", transport:"Transport", returns:"Returns / Damage / Expiry",
  marketing:"Marketing", staff:"Staff", credit:"Credit", exit:"Exit Policy", documents:"Documents",
  paymentSafety:"Payment Safety", simulator:"Simulator",
};
async function exportJson(){
  await preloadAllPhotos(state.c1);
  await preloadAllPhotos(state.c2);
  const photoData = {};
  [...allPhotoIdsIn(state.c1), ...allPhotoIdsIn(state.c2)].forEach(id=>{
    const v = photoCache.get(id);
    if(v && v!=="loading") photoData[id] = v;
  });
  const payload = {...state, __photoData: photoData};
  const blob = new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "distributor-decision-pro-backup.json";
  a.click();
  showToast("Backup downloaded (photos included)");
}
async function printReport(){
  const c1=state.c1, c2=state.c2;
  await preloadAllPhotos(c1);
  await preloadAllPhotos(c2);
  const fd = finalDecision();
  const td = "padding:4px 6px;border:1px solid #ddd;font-size:11.5px;";
  const tdb = td+"font-weight:bold;";
  function row(label,val,bold){ return `<tr><td style="${bold?tdb:td}">${esc(label)}</td><td style="${bold?tdb:td}">${val}</td></tr>`; }
  function companySection(c){
    const s = companySummary(c);
    const sc = computeScore(c);
    const w = weightedMargins(c.products);
    const sim = computeSimulator(c);
    const sens = computeSensitivity(c);
    const items = computeRiskItems(c);
    const d = companyDecision(c);
    const ps = paymentSafetyStatus(c);
    const neg = generateNegotiationPoints(c);
    const tier = territoryTier(c.territory, c.documents);
    const total = num(c.investment.total);
    const nonInv = num(c.investment.branding)+num(c.investment.registration)+num(c.investment.transport)+num(c.investment.deposit)+num(c.investment.gst)+num(c.investment.other);
    const unrep = total>0 ? Math.max(0,total-w.totalEffCost-nonInv) : 0;
    const bySev = {FATAL:[],HIGH:[],MEDIUM:[],LOW:[]};
    items.forEach(i=>bySev[i.severity].push(i));

    return `
    <div style="page-break-before:always;">
    <h2 style="font-family:Georgia,serif;border-bottom:2px solid #333;padding-bottom:4px;">${esc(c.name)} — ${esc(c.meta.legalName)||"Legal name not entered"}</h2>
    <div style="font-size:11px;color:#900;font-weight:bold;">${(c.investment.notes||"").includes("DEMO")?"⚠️ CONTAINS DEMO/SAMPLE DATA — not verified company information":""}</div>

    <h3>A. Executive Decision</h3>
    <table style="width:100%;border-collapse:collapse;">
      ${row("Decision", esc(d.decision), true)}
      ${row("Fatal Risk Status", d.hasFatal?"FATAL RISK PRESENT":"None detected")}
      ${row("Verification %", sc.docPct+"%")}
      ${row("Score", sc.total+"/100")}
      ${row("Risk Tier", esc(d.level.label))}
    </table>
    <ul style="font-size:11.5px;">${d.reasons.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>

    <h3>B. Investment Analysis</h3>
    <table style="width:100%;border-collapse:collapse;">
      ${row("Total Investment", inr(total))}
      ${row("Inventory (Effective) Value", inr(w.totalEffCost))}
      ${row("Unrepresented Investment", inr(unrep))}
      ${row("Branding/Other Charges", inr(nonInv))}
      ${row("Reconciliation", sc.reconciled?"OK":"DOES NOT RECONCILE")}
    </table>

    <h3>C. Product Economics</h3>
    <table style="width:100%;border-collapse:collapse;">
      ${row("Product Count", c.products.length)}
      ${row("Weighted Distributor Margin", pct(w.weightedMarginPct))}
      ${row("Weighted Distributor Markup", pct(w.weightedMarkupPct))}
      ${row("Total Stock Value (Effective)", inr(w.totalEffCost))}
      ${row("Total MRP Value", inr(w.totalMRPValue))}
      ${row("Total Potential Gross Profit", inr(w.totalGP))}
    </table>

    <h3>D. Sales & Profit Simulation</h3>
    <table style="width:100%;border-collapse:collapse;">
      ${row("Monthly Sales (entered)", c.simulator.monthlySales?inr(num(c.simulator.monthlySales)):"Not entered")}
      ${row("Selected Margin", pct(sim.marginPct)+" ("+sim.marginSource+")")}
      ${row("Operating Expenses", inr(sim.expenses))}
      ${row("Estimated Net Operating Profit", inr(sim.netProfit), true)}
      ${row("Break-even Sales", sim.breakEvenSales!=null?inr(sim.breakEvenSales):"—")}
      ${row("Recovery Period", sim.recoveryMonths!=null?sim.recoveryMonths.toFixed(1)+" months":"Investment recovery is not occurring under this scenario.")}
      ${Object.entries(sens).map(([n,v])=>row(n+" Scenario (monthly profit / recovery)", inr(v.netProfit)+" / "+(v.recoveryMonths!=null?v.recoveryMonths.toFixed(1)+" mo":"Not achieved"))).join("")}
    </table>
    <div style="font-size:10.5px;color:#777;font-style:italic;">Scenario estimate — not a forecast. Not a guaranteed return.</div>

    <h3>E. Territory</h3>
    <table style="width:100%;border-collapse:collapse;">
      ${row("District", esc(c.territory.district)||"—")}
      ${row("Territory Tier", esc(tier.label))}
      ${row("Exclusivity Claimed", esc(c.territory.type)||"—")}
      ${row("Written in Agreement", esc(c.territory.agreementMentions)||"Not Clear")}
      ${row("Company Can Appoint Another", esc(c.territory.canAppoint)||"Not Clear")}
    </table>

    <h3>F. Targets</h3>
    <table style="width:100%;border-collapse:collapse;">
      ${row("Monthly Target", c.target.monthly?inr(num(c.target.monthly)):"—")}
      ${row("Weekly (derived)", c.target.monthly?inr(num(c.target.monthly)/4.33):"—")}
      ${row("Quarterly (derived)", c.target.monthly?inr(num(c.target.monthly)*3):"—")}
      ${row("Annual (derived)", c.target.monthly?inr(num(c.target.monthly)*12):"—")}
      ${row("Expected Monthly Sales", c.simulator.monthlySales?inr(num(c.simulator.monthlySales)):"Not entered")}
      ${row("Consequence of Missing Target", esc(c.target.failureConsequence)||"Not Clear")}
    </table>

    <h3>G. Risk (FATAL / HIGH / MEDIUM / LOW)</h3>
    ${["FATAL","HIGH","MEDIUM","LOW"].filter(sv=>bySev[sv].length).map(sv=>`
      <div style="font-weight:bold;margin-top:6px;color:${sv==='FATAL'||sv==='HIGH'?'#AE2E24':'#A66A0C'};">${sv} (${bySev[sv].length})</div>
      <ul style="font-size:11px;margin:2px 0 6px;">${bySev[sv].map(i=>`<li>${esc(i.text)} — <i>${esc(i.category)}</i></li>`).join("")}</ul>
    `).join("") || `<div>No risk items detected from entered data.</div>`}

    <h3>H. Documents</h3>
    <table style="width:100%;border-collapse:collapse;">
      ${DOC_LIST.map(([k,label])=>row(label, esc(c.documents[k])||"Not Available")).join("")}
    </table>

    <h3>I. Payment Safety</h3>
    <table style="width:100%;border-collapse:collapse;">
      ${row("Verification %", ps.pct+"%")}
      ${row("Safe to Pay", ps.safeToPay?"Yes — critical items verified":"NO — "+ps.criticalPending.length+" critical item(s) unverified", true)}
      ${PAYMENT_SAFETY_ITEMS.map(([k,label])=>row(label, esc(c.paymentSafety[k])||"Not Verified")).join("")}
    </table>

    <h3>J. Negotiation</h3>
    ${neg.length?neg.slice(0,6).map(p=>`<div style="margin-bottom:6px;font-size:11px;"><b>${esc(p.issue)}</b>: ${esc(p.ask)} <i>(Walk-away: ${esc(p.walkAway)})</i></div>`).join(""):"<div>No specific negotiation points auto-detected.</div>"}

    <h3>Photo Evidence</h3>
    ${(()=>{
      const photoRows = [];
      Object.keys(c).forEach(k=>{ if(c[k] && Array.isArray(c[k].photos)) c[k].photos.forEach(p=>photoRows.push({section:SECTION_PRINT_LABELS[k]||k, caption:p.caption, id:p.id})); });
      if(c.meeting && c.meeting.answers) Object.entries(c.meeting.answers).forEach(([qi,a])=>{ if(Array.isArray(a.photos)) a.photos.forEach(p=>photoRows.push({section:"Meeting Q"+(Number(qi)+1), caption:p.caption, id:p.id})); });
      if(!photoRows.length) return `<div style="font-size:11px;color:#777;">No photos attached.</div>`;
      return `<div style="display:flex;flex-wrap:wrap;gap:8px;">
        ${photoRows.map(p=>{
          const src = photoCache.get(p.id);
          const img = (src && src!=="loading") ? `<img src="${src}" style="width:100%;height:105px;object-fit:cover;border:1px solid #ccc;border-radius:6px;">`
            : `<div style="width:100%;height:105px;border:1px solid #ccc;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#999;font-size:10px;">Image unavailable</div>`;
          return `<div style="width:140px;font-size:10px;text-align:center;">${img}
            <div style="margin-top:3px;font-weight:bold;">${esc(p.caption)||"(no caption)"}</div>
            <div style="color:#999;">${esc(p.section)}</div>
          </div>`;
        }).join("")}
      </div>`;
    })()}
    </div>`;
  }
  const html = `
    <h1 style="font-family:Georgia,serif;">Distributor Decision Pro — Full Comparison Report</h1>
    <p style="color:#555;font-size:12px;">Generated: ${new Date().toLocaleString("en-IN")}</p>
    <h2 style="margin-top:20px;">K. Final Recommendation: ${esc(fd.decision)}</h2>
    <ul style="font-size:12.5px;">${fd.reasons.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>
    ${fd.pendingItems.length?`<div style="background:#fbeae8;padding:10px;border-radius:6px;"><b>DO NOT PAY YET — Pending:</b><ul style="font-size:12px;">${fd.pendingItems.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>`:""}
    <p style="font-size:11px;color:#777;font-style:italic;">This report is based entirely on information entered into the app. It is an estimate, not a guaranteed return, and not legal or financial advice. Verify all documents in original before paying.</p>
    <hr>
    ${companySection(c1)}
    ${companySection(c2)}
  `;
  document.getElementById("print-area").innerHTML = html;
  window.print();
}

/* ================= INIT ================= */
async function init(){
  const loaded = await loadState();
  if(loaded){
    const fresh = freshState();
    state = Object.assign(fresh, loaded);
    state.c1 = migrateCompany(loaded.c1, "Company 1");
    state.c2 = migrateCompany(loaded.c2, "Company 2");
    if(!state.meetingIndex) state.meetingIndex = {c1:0,c2:0};
    if(!state.openSections) state.openSections = {};
    const changed1 = await migrateInlinePhotos(state.c1);
    const changed2 = await migrateInlinePhotos(state.c2);
    if(changed1 || changed2) scheduleSave();
  }
  render();
}
init();
</script>
