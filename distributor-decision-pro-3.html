<!DOCTYPE html>
<html lang="hi-en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Distributor Decision Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F4F0;
  --surface:#FFFFFF;
  --surface-2:#FBFAF7;
  --ink:#161C1A;
  --ink-soft:#5C635F;
  --ink-faint:#8A8F8B;
  --border:#DFDCD3;
  --border-soft:#EBE9E2;
  --accent:#0E4A40;
  --accent-2:#C8863C;
  --accent-soft:#E3ECE8;
  --good:#1B7A4B;
  --good-soft:#E7F4EC;
  --warn:#A66A0C;
  --warn-soft:#FBF0DD;
  --bad:#AE2E24;
  --bad-soft:#FBEAE8;
  --radius:14px;
  --radius-sm:9px;
  --shadow:0 1px 2px rgba(20,25,22,.04), 0 6px 20px -8px rgba(20,25,22,.10);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:78px;
  min-height:100vh;
}
.font-display{font-family:'Fraunces',serif;}
h1,h2,h3{margin:0;font-family:'Fraunces',serif;font-weight:600;letter-spacing:-0.01em;}
p{margin:0;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--accent-soft);}
.tabular{font-variant-numeric:tabular-nums;}

/* ===== HEADER ===== */
.topbar{
  position:sticky;top:0;z-index:40;
  background:var(--accent);
  color:#fff;
  padding:14px 16px 12px;
}
.topbar-inner{max-width:920px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.brand{display:flex;flex-direction:column;gap:1px;}
.brand-name{font-size:19px;font-weight:600;letter-spacing:-0.01em;line-height:1.15;}
.brand-sub{font-size:11.5px;color:#BFE0D3;font-family:'Inter';font-weight:500;}
.company-switch{display:flex;gap:6px;}
.pill-btn{
  border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.08);
  color:#fff;
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
}
.pill-btn.active{background:#fff;color:var(--accent);border-color:#fff;}

/* ===== LAYOUT ===== */
.wrap{max-width:920px;margin:0 auto;padding:16px;}
.section-title{font-size:13px;font-weight:700;text-transform:none;color:var(--ink-soft);margin:22px 2px 10px;letter-spacing:.01em;}
.section-title:first-child{margin-top:4px;}

/* ===== DASHBOARD CARDS ===== */
.dash-grid{display:grid;grid-template-columns:1fr;gap:12px;}
@media(min-width:640px){.dash-grid{grid-template-columns:1fr 1fr;}}
.company-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
}
.company-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent-2);}
.company-card.filled:before{background:var(--good);}
.company-card h3{font-size:17px;margin-bottom:2px;}
.status-tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn);margin-bottom:10px;}
.status-tag.filled{background:var(--good-soft);color:var(--good);}
.mini-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:8px;}
.mini-stat{display:flex;flex-direction:column;gap:1px;}
.mini-stat .lbl{font-size:10.5px;color:var(--ink-faint);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
.mini-stat .val{font-size:15px;font-weight:700;}
.card-action{
  margin-top:14px;width:100%;padding:11px;border-radius:10px;border:none;
  background:var(--accent);color:#fff;font-weight:600;font-size:14px;
}
.dash-actions{display:flex;flex-direction:column;gap:10px;margin-top:18px;}
.btn-secondary{
  padding:13px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface);color:var(--ink);font-weight:600;font-size:14.5px;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-primary-lg{
  padding:15px;border-radius:10px;border:none;
  background:var(--accent);color:#fff;font-weight:700;font-size:15px;
}

/* ===== FORM SYSTEM ===== */
.accordion{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow);}
.accordion-head{
  padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.accordion-head-left{display:flex;flex-direction:column;gap:2px;}
.accordion-head h4{font-size:15px;font-family:'Inter';font-weight:700;}
.accordion-head .sub{font-size:12px;color:var(--ink-faint);font-family:'Inter';}
.accordion-chev{width:20px;height:20px;flex:none;color:var(--ink-faint);transition:transform .15s;}
.accordion.open .accordion-chev{transform:rotate(180deg);}
.accordion-body{display:none;padding:2px 16px 18px;border-top:1px solid var(--border-soft);}
.accordion.open .accordion-body{display:block;}
.accordion-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;}
.field{margin-top:14px;}
.field label{display:block;font-size:13.5px;font-weight:600;margin-bottom:3px;}
.field .explain{font-size:12px;color:var(--ink-faint);margin-bottom:7px;line-height:1.4;}
.field input[type=text],.field input[type=number],.field input[type=tel],.field textarea,.field select{
  width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:9px;
  font-size:14.5px;background:var(--surface-2);color:var(--ink);
}
.field textarea{min-height:64px;resize:vertical;}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent);background:#fff;}
.pillgroup{display:flex;flex-wrap:wrap;gap:7px;}
.pillgroup button{
  padding:9px 13px;border-radius:9px;border:1.5px solid var(--border);background:var(--surface-2);
  font-size:13px;font-weight:600;color:var(--ink-soft);
}
.pillgroup button.sel{background:var(--accent);border-color:var(--accent);color:#fff;}
.pillgroup button.sel.good{background:var(--good);border-color:var(--good);}
.pillgroup button.sel.bad{background:var(--bad);border-color:var(--bad);}
.pillgroup button.sel.warn{background:var(--warn);border-color:var(--warn);}
.field-note{margin-top:16px;}
.currency-prefix{position:relative;}
.currency-prefix span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-weight:600;font-size:14.5px;}
.currency-prefix input{padding-left:26px !important;}

/* ===== ALERTS ===== */
.alert{padding:11px 13px;border-radius:10px;font-size:13px;font-weight:600;line-height:1.45;margin-top:12px;display:flex;gap:8px;}
.alert.bad{background:var(--bad-soft);color:var(--bad);}
.alert.warn{background:var(--warn-soft);color:var(--warn);}
.alert.good{background:var(--good-soft);color:var(--good);}
.alert svg{flex:none;margin-top:1px;}

/* ===== PRODUCTS ===== */
.product-card{border:1.5px solid var(--border);border-radius:12px;padding:13px;margin-top:12px;background:var(--surface-2);}
.product-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px;}
.product-card-top input{font-weight:700;font-size:15px;border:none;background:transparent;padding:0;width:100%;}
.icon-btn{border:none;background:transparent;color:var(--ink-faint);padding:4px;flex:none;}
.icon-btn:hover{color:var(--bad);}
.product-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.product-grid .f{display:flex;flex-direction:column;gap:3px;}
.product-grid label{font-size:10.5px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.02em;}
.product-grid input,.product-grid select{padding:8px 9px;border:1px solid var(--border);border-radius:7px;font-size:13.5px;background:#fff;}
.product-calc{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;}
.product-calc .c{display:flex;justify-content:space-between;font-size:12.5px;}
.product-calc .c b{font-weight:700;}
.add-product-btn{margin-top:12px;width:100%;padding:12px;border-radius:9px;border:1.5px dashed var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px;}
.totals-strip{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;background:var(--accent-soft);border-radius:10px;padding:12px 14px;margin-top:12px;}
.totals-strip .t{display:flex;flex-direction:column;}
.totals-strip .t .l{font-size:10.5px;font-weight:700;color:var(--accent);opacity:.75;text-transform:uppercase;}
.totals-strip .t .v{font-size:15px;font-weight:800;color:var(--accent);}

/* ===== DOC CHECKLIST ===== */
.doc-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border-soft);gap:10px;}
.doc-row:last-child{border-bottom:none;}
.doc-row .name{font-size:13.5px;font-weight:600;flex:1;}
.doc-progress{height:9px;background:var(--border-soft);border-radius:99px;overflow:hidden;margin-top:6px;}
.doc-progress-fill{height:100%;background:var(--good);border-radius:99px;transition:width .3s;}
.photo-strip{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.photo-card{position:relative;display:flex;gap:10px;align-items:center;border:1px solid var(--border);border-radius:10px;padding:8px;background:var(--surface-2);}
.photo-card .photo-thumb{flex-shrink:0;width:56px;height:56px;border-radius:8px;overflow:hidden;border:1px solid var(--border);background:#fff;}
.photo-card .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-thumb-loading,.photo-thumb-missing{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--ink-faint);}
.photo-card .photo-meta{flex:1;min-width:0;}
.photo-card .photo-caption{width:100%;border:1px solid var(--border);border-radius:7px;padding:7px 9px;font-size:12.5px;font-family:inherit;}
.photo-card .photo-ts{font-size:10.5px;color:var(--ink-faint);margin-top:3px;}
.photo-del{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:none;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}

/* ===== SIMULATOR RESULT ===== */
.result-box{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:16px;margin-top:14px;}
.result-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border-soft);font-size:13.5px;}
.result-row:last-child{border-bottom:none;}
.result-row.total{font-weight:800;font-size:16px;color:var(--accent);}
.result-row .v{font-weight:700;}
.big-metric{text-align:center;padding:18px 10px;background:var(--accent);border-radius:12px;color:#fff;margin-top:14px;}
.big-metric .num{font-size:30px;font-weight:800;font-family:'Fraunces';}
.big-metric .lbl{font-size:12.5px;color:#BFE0D3;font-weight:600;margin-top:2px;}
.disclaimer{font-size:11.5px;color:var(--ink-faint);margin-top:10px;line-height:1.5;font-style:italic;}

/* ===== RISK ===== */
.risk-badge{display:inline-block;padding:6px 14px;border-radius:999px;font-weight:800;font-size:13px;margin-top:6px;}
.risk-LOW{background:var(--good-soft);color:var(--good);}
.risk-MEDIUM{background:var(--warn-soft);color:var(--warn);}
.risk-HIGH{background:#FBE3D8;color:#B2541A;}
.risk-VERYHIGH{background:var(--bad-soft);color:var(--bad);}
.flag-item{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:13px;}
.flag-item:last-child{border-bottom:none;}
.flag-dot{width:8px;height:8px;border-radius:50%;background:var(--bad);flex:none;margin-top:5px;}

/* ===== SCORE ===== */
.score-ring-wrap{display:flex;align-items:center;gap:16px;margin-top:12px;}
.score-num{font-size:38px;font-weight:800;font-family:'Fraunces';color:var(--accent);}
.score-bars{flex:1;display:flex;flex-direction:column;gap:8px;}
.score-bar-row{display:flex;align-items:center;gap:8px;font-size:11.5px;}
.score-bar-row .lb{width:96px;flex:none;color:var(--ink-soft);font-weight:600;}
.score-bar-track{flex:1;height:7px;background:var(--border-soft);border-radius:99px;overflow:hidden;}
.score-bar-fill{height:100%;background:var(--accent);}
.score-bar-row .pt{width:40px;text-align:right;font-weight:700;color:var(--ink);flex:none;}
.slider-row{margin-top:12px;}
.slider-row label{font-size:13px;font-weight:600;display:flex;justify-content:space-between;}
.slider-row input[type=range]{width:100%;margin-top:6px;accent-color:var(--accent);}

/* ===== COMPARISON ===== */
.compare-table{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface);border-radius:12px;overflow:hidden;border:1px solid var(--border);}
.compare-table th,.compare-table td{padding:10px 10px;text-align:left;border-bottom:1px solid var(--border-soft);}
.compare-table th{background:var(--surface-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.02em;color:var(--ink-faint);font-weight:700;}
.compare-table td.rowlabel{font-weight:600;color:var(--ink-soft);white-space:nowrap;}
.compare-table tr:last-child td{border-bottom:none;}
.tag-ok{color:var(--good);font-weight:700;}
.tag-warn{color:var(--warn);font-weight:700;}
.tag-bad{color:var(--bad);font-weight:700;}
.compare-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}

/* ===== FINAL DECISION ===== */
.decision-hero{border-radius:16px;padding:26px 20px;text-align:center;color:#fff;}
.decision-hero.good{background:linear-gradient(160deg,#0E4A40,#146652);}
.decision-hero.bad{background:linear-gradient(160deg,#7A2620,#9C332A);}
.decision-hero .tag{font-size:11.5px;font-weight:700;letter-spacing:.06em;opacity:.75;text-transform:uppercase;}
.decision-hero h2{font-size:26px;margin-top:6px;color:#fff;}
.reason-list{margin-top:14px;}
.reason-item{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--border-soft);font-size:13.5px;align-items:flex-start;}
.reason-item:last-child{border-bottom:none;}
.pending-box{background:var(--bad-soft);border-radius:12px;padding:14px 16px;margin-top:14px;}
.pending-box h4{color:var(--bad);font-family:'Inter';font-size:14px;margin-bottom:8px;}
.pending-box .item{font-size:13px;color:var(--bad);padding:4px 0;display:flex;gap:7px;}

/* ===== MEETING MODE ===== */
.meeting-progress-bar{height:6px;background:var(--border-soft);border-radius:99px;overflow:hidden;margin:12px 0 4px;}
.meeting-progress-fill{height:100%;background:var(--accent-2);transition:width .2s;}
.meeting-qcard{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:22px 18px;margin-top:14px;box-shadow:var(--shadow);}
.meeting-qnum{font-size:11.5px;font-weight:700;color:var(--accent-2);text-transform:uppercase;letter-spacing:.03em;}
.meeting-qtext{font-size:19px;font-weight:600;font-family:'Fraunces';margin-top:6px;line-height:1.35;}
.meeting-nav{display:flex;gap:10px;margin-top:16px;}
.meeting-nav button{flex:1;padding:12px;border-radius:9px;border:1.5px solid var(--border);background:var(--surface);font-weight:700;font-size:14px;}
.meeting-nav button:disabled{opacity:.35;}
.meeting-jump{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px;max-height:150px;overflow:auto;}
.meeting-jump button{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);font-size:11px;font-weight:700;background:var(--surface-2);}
.meeting-jump button.cur{border-color:var(--accent);border-width:2px;}
.meeting-jump button.answered{background:var(--good-soft);color:var(--good);border-color:transparent;}
.custom-q-add{display:flex;gap:8px;margin-top:14px;}
.custom-q-add input{flex:1;padding:10px;border-radius:9px;border:1px solid var(--border);}
.custom-q-add button{padding:10px 14px;border-radius:9px;border:none;background:var(--accent);color:#fff;font-weight:700;}

/* ===== BOTTOM NAV ===== */
.bottomnav{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:rgba(255,255,255,.94);backdrop-filter:blur(10px);
  border-top:1px solid var(--border);
  display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.bottomnav button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  border:none;background:transparent;color:var(--ink-faint);padding:6px 2px;border-radius:10px;font-size:10px;font-weight:600;
}
.bottomnav button.active{color:var(--accent);}
.bottomnav svg{width:20px;height:20px;}

/* ===== MISC ===== */
.top-actions{display:flex;gap:8px;margin-bottom:4px;}
.small-btn{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink-soft);}
.warning-banner{background:var(--bad);color:#fff;padding:12px 16px;border-radius:12px;font-weight:700;font-size:14px;display:flex;gap:9px;align-items:center;margin-bottom:14px;}
.hidden{display:none !important;}
.footer-space{height:20px;}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-size:12.5px;font-weight:600;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;}
.toast.show{opacity:1;}
#print-area{display:none;}
@media print{
  body *{visibility:hidden;}
  #print-area,#print-area *{visibility:visible;}
  #print-area{display:block;position:absolute;left:0;top:0;width:100%;padding:20px;}
  .bottomnav,.topbar{display:none;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-name">Distributor Decision Pro</div>
      <div class="brand-sub">Compare Before You Invest</div>
    </div>
    <div class="company-switch" id="companySwitch"></div>
  </div>
</div>

<div class="wrap" id="app"></div>
<div id="print-area"></div>
<div class="toast" id="toast"></div>

<div class="bottomnav" id="bottomnav"></div>

<script>
/* =========================================================
   DISTRIBUTOR DECISION PRO — single file app
   ========================================================= */

/* ---------- storage helpers (in-memory + window.storage) ---------- */
const STORAGE_KEY = "ddp-state-v1";
let saveTimer = null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      if(window.storage && typeof window.storage.set === "function"){
        const json = JSON.stringify(state);
        if(json.length > 4.5*1024*1024){
          showToast("⚠️ App data (text) bahut bada ho gaya hai — kripya kuch notes/products kam karein.");
          return;
        }
        await window.storage.set(STORAGE_KEY, json, false);
      }
    }catch(e){ showToast("⚠️ Save nahi ho paya."); }
  }, 400);
}
async function loadState(){
  try{
    if(window.storage && typeof window.storage.get === "function"){
      const r = await window.storage.get(STORAGE_KEY, false);
      if(r && typeof r === "object" && r.value) return JSON.parse(r.value);
    }
  }catch(e){ /* key not found or storage unavailable */ }
  return null;
}
/* ---------- Photo blob storage: EACH photo gets its own storage key ----------
   The main state blob has a combined 5MB cap. Keeping photos out of it means adding
   more photos never competes with your other data or forces you to delete anything —
   each photo (compressed to ~50-150KB) has its own slot, well under that cap on its own. */
const photoCache = new Map(); // id -> dataUrl ("loading" while a fetch is in flight, undefined if it failed)
function photoStorageKey(id){ return "photo:"+id; }
async function savePhotoBlob(id, dataUrl){
  if(!(window.storage && typeof window.storage.set === "function")) return;
  await window.storage.set(photoStorageKey(id), dataUrl, false);
}
async function loadPhotoBlob(id){
  if(!(window.storage && typeof window.storage.get === "function")) return null;
  try{
    const r = await window.storage.get(photoStorageKey(id), false);
    return (r && r.value) ? r.value : null;
  }catch(e){ return null; }
}
async function deletePhotoBlob(id){
  if(!(window.storage && typeof window.storage.delete === "function")) return;
  try{ await window.storage.delete(photoStorageKey(id)); }catch(e){ /* already gone, fine */ }
}
function ensurePhotoLoaded(id){
  if(photoCache.has(id)) return; // already loaded, loading, or known-missing
  photoCache.set(id, "loading");
  loadPhotoBlob(id).then(val=>{ photoCache.set(id, val || undefined); render(); })
                    .catch(()=>{ photoCache.set(id, undefined); render(); });
}
/* Collects every {id} referenced anywhere in a company's photo arrays. */
function allPhotoIdsIn(c){
  const ids = [];
  Object.keys(c).forEach(k=>{ if(c[k] && Array.isArray(c[k].photos)) c[k].photos.forEach(p=>ids.push(p.id)); });
  if(c.meeting && c.meeting.answers) Object.values(c.meeting.answers).forEach(a=>{ if(Array.isArray(a.photos)) a.photos.forEach(p=>ids.push(p.id)); });
  return ids;
}
/* One-time migration: earlier builds stored dataUrl inline inside state. Move any such
   photo into its own storage key + in-memory cache, and strip the heavy field out of state. */
async function migrateInlinePhotos(c){
  let changed = false;
  const migrateArr = async (arr)=>{
    for(const p of (arr||[])){
      if(p && p.dataUrl){
        photoCache.set(p.id, p.dataUrl);
        try{ await savePhotoBlob(p.id, p.dataUrl); }catch(e){ /* keep in-memory at least */ }
        delete p.dataUrl;
        changed = true;
      }
    }
  };
  for(const k of Object.keys(c)){ if(c[k] && Array.isArray(c[k].photos)) await migrateArr(c[k].photos); }
  if(c.meeting && c.meeting.answers){ for(const a of Object.values(c.meeting.answers)){ if(Array.isArray(a.photos)) await migrateArr(a.photos); } }
  return changed;
}
/* Preloads every photo a company actually references — used before printing/exporting
   so we're never missing image data at the moment it's needed. */
async function preloadAllPhotos(c){
  const ids = [...new Set(allPhotoIdsIn(c))];
  for(const id of ids){
    if(!photoCache.has(id) || photoCache.get(id)===undefined){
      const val = await loadPhotoBlob(id);
      photoCache.set(id, val || undefined);
    }
  }
}

/* ---------- formatting ---------- */
function inr(n){
  n = Number(n)||0;
  const neg = n<0; n=Math.abs(n);
  let s = n.toFixed(n%1===0?0:2);
  let [intPart, dec] = s.split(".");
  let last3 = intPart.slice(-3);
  let rest = intPart.slice(0,-3);
  if(rest) rest = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ",");
  let out = (rest? rest+","+last3 : last3);
  return (neg?"-":"") + "₹" + out + (dec?("."+dec):"");
}
function num(v){ const n=parseFloat(v); return isNaN(n)?0:n; }
function pct(n){ return (isFinite(n)?n:0).toFixed(1)+"%"; }
function uid(){ return Math.random().toString(36).slice(2,9); }
function esc(v){
  if(v===null||v===undefined) return "";
  return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* Deep-merges a freshly-created default object with a loaded (possibly older) saved object,
   so new fields introduced by app upgrades never crash on old localStorage data. */
function deepMergeDefaults(base, loaded){
  if(loaded===undefined || loaded===null) return base;
  if(Array.isArray(base)) return Array.isArray(loaded) ? loaded : base;
  if(typeof base === "object"){
    const out = {...base};
    Object.keys(base).forEach(k=>{ out[k] = deepMergeDefaults(base[k], loaded[k]); });
    Object.keys(loaded).forEach(k=>{ if(!(k in out)) out[k]=loaded[k]; });
    return out;
  }
  return loaded;
}

/* ---------- Photo proof: camera capture, compressed client-side before storage ----------
   Storage is a single JSON blob with a 5MB cap, so every photo is downsized + re-encoded
   as JPEG before it ever touches state — this keeps a typical photo to roughly 40-150KB. */
const PHOTO_MAX_DIM = 700;
const PHOTO_QUALITY = 0.5;
function compressImageFile(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>=h && w>PHOTO_MAX_DIM){ h=Math.round(h*PHOTO_MAX_DIM/w); w=PHOTO_MAX_DIM; }
        else if(h>w && h>PHOTO_MAX_DIM){ w=Math.round(w*PHOTO_MAX_DIM/h); h=PHOTO_MAX_DIM; }
        const canvas = document.createElement("canvas");
        canvas.width=w; canvas.height=h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg", PHOTO_QUALITY));
      };
      img.onerror = ()=>reject(new Error("Image load failed"));
      img.src = reader.result;
    };
    reader.onerror = ()=>reject(new Error("File read failed"));
    reader.readAsDataURL(file);
  });
}
/* Resolves the actual array to push/remove photos from, for either a per-section
   notes field or a per-question Meeting Mode answer. */
function getPhotoArray(kind, key){
  const c = curCompany();
  if(kind==="section"){
    if(!c[key]) return [];
    if(!c[key].photos) c[key].photos = [];

    if(!c.meeting.answers[i]) c.meeting.answers[i] = {status:"",note:""};
    if(!c.meeting.answers[i].photos) c.meeting.answers[i].photos = [];
    return c.meeting.answers[i].photos;
  }
  return [];
}

function wirePhotoCapture(){
  document.querySelectorAll("[data-photobtn]").forEach(b=>b.addEventListener("click",()=>{
    const inp = document.getElementById(b.dataset.photobtn);
    if(inp) inp.click();
  }));
  document.querySelectorAll("[data-photocapture]").forEach(inp=>{
    inp.addEventListener("change", async ()=>{
      const file = inp.files && inp.files[0];
      if(!file) return;
      const arr = getPhotoArray(inp.dataset.photokind, inp.dataset.photokey);
      try{
        const dataUrl = await compressImageFile(file);
        const id = uid();
        photoCache.set(id, dataUrl);
        arr.push({id, caption:"", ts:Date.now()});
        render(); // shows immediately from the in-memory cache
        scheduleSave(); // saves the (now tiny — id/caption/ts only) state metadata
        try{ await savePhotoBlob(id, dataUrl); }
        catch(e){ showToast("⚠️ Photo apne slot mein save nahi ho payi — dobara try karein"); }
      }catch(e){
        showToast("Photo attach nahi ho payi: "+e.message);
      }
      inp.value = "";
    });
  });
  document.querySelectorAll("[data-photocaption]").forEach(inp=>{
    inp.addEventListener("input", ()=>{
      const arr = getPhotoArray(inp.dataset.photokind, inp.dataset.photokey);
      const photo = arr.find(p=>p.id===inp.dataset.photocaption);
      if(photo){ photo.caption = inp.value; scheduleSave(); }
    });
  });
  document.querySelectorAll("[data-photodel]").forEach(b=>b.addEventListener("click",()=>{
    const arr = getPhotoArray(b.dataset.photokind, b.dataset.photokey);
    const idx = arr.findIndex(p=>p.id===b.dataset.photodel);
    if(idx>=0){
      const id = arr[idx].id;
      arr.splice(idx,1);
      photoCache.delete(id);
      scheduleSave();
      render();
      deletePhotoBlob(id).catch(()=>{});
    }
  }));
}

/* ---- Products ---- */
/* GST + Scheme engine — turns listed distributor price into a REAL effective purchase price. */
function computeEffectivePrice(p){
  const dp = num(p.distPrice);
  const gstPct = num(p.gstPct);
  const qty = num(p.qty) || 1;
  let grossPrice = dp;
  let gstUnknown = false;
  if(p.gstType === "Exclusive"){
    grossPrice = dp * (1 + gstPct/100);
  } else if(p.gstType === "Inclusive"){
    grossPrice = dp; // do NOT add GST again
  } else {
    grossPrice = dp;
    gstUnknown = true; // GST treatment not specified — result cannot be confirmed
  }
  const st = p.schemeType || "None";
  let effUnitPrice = grossPrice;
  let schemeKnown = true;
  if(st === "None" || !st){
    effUnitPrice = grossPrice;
  } else if(st === "Percentage"){
    effUnitPrice = grossPrice * (1 - num(p.schemePct)/100);
  } else if(st === "Flat"){
    effUnitPrice = Math.max(0, grossPrice - num(p.schemeFlat));
  } else if(st === "Free Units"){
    const free = num(p.schemeFreeUnits);
    const totalUnits = qty + free;
    effUnitPrice = totalUnits>0 ? (qty*grossPrice)/totalUnits : grossPrice;
  } else if(st === "Buy X Get Y"){
    const X = num(p.schemeBuyX), Y = num(p.schemeGetY);
    if(X>0 && Y>0){
      const freeSets = Math.floor(qty/X);
      const totalUnits = qty + freeSets*Y;
      effUnitPrice = totalUnits>0 ? (qty*grossPrice)/totalUnits : grossPrice;
    } else { schemeKnown = false; }
  } else { // "Manual / Other" — free text scheme field, cannot be computed
    schemeKnown = false;
  }
  return {grossPrice, effUnitPrice, gstUnknown, schemeKnown};
}
function productCalc(p){
  const qty=num(p.qty), mrp=num(p.mrp), dp=num(p.distPrice), rsp=num(p.retailPrice);
  const eff = computeEffectivePrice(p);
  const effPrice = eff.effUnitPrice;
  // Margin/Markup are always computed off the REAL effective cost, not the listed price.
  const distGP = rsp-effPrice;
  const distMarginPct = rsp>0? (distGP/rsp*100):0;
  const distMarkupPct = effPrice>0? (distGP/effPrice*100):0;
  const retGP = mrp-rsp;
  const retMarginPct = mrp>0? (retGP/mrp*100):0;
  const listedStockValue = qty*dp;              // what the price list says
  const stockValue = qty*effPrice;               // total EFFECTIVE inventory cost (GST + scheme adjusted)
  const mrpValue = qty*mrp;
  const totalDistGP = qty*distGP;
  const totalRetGP = qty*retGP;
  // validation flags for this product row
  const warnings = [];
  if(dp<0||mrp<0||rsp<0||qty<0) warnings.push("Negative value entered");
  if(mrp>0 && rsp>mrp) warnings.push("Retailer price is higher than MRP");
  if(effPrice>0 && rsp>0 && effPrice>rsp) warnings.push("Distributor price is higher than retailer selling price");
  if(distMarginPct>100||distMarginPct<-100) warnings.push("Margin outside realistic range");
  if(!mrp) warnings.push("MRP missing");
  return {distGP,distMarginPct,distMarkupPct,retGP,retMarginPct,stockValue,listedStockValue,mrpValue,totalDistGP,totalRetGP,
          effPrice,grossPrice:eff.grossPrice,gstUnknown:eff.gstUnknown,schemeKnown:eff.schemeKnown,warnings};
}
const SCHEME_TYPES = ["None","Percentage","Flat","Free Units","Buy X Get Y","Manual / Other"];
/* Weighted margin — value-weighted, NOT a simple average of per-product percentages. */
function weightedMargins(products){
  let totalGP=0, totalRSPValue=0, totalEffCost=0, totalMRPValue=0, totalUnits=0, totalListedValue=0;
  products.forEach(p=>{
    const c = productCalc(p);
    const qty = num(p.qty);
    totalUnits += qty;
    totalGP += c.totalDistGP;
    totalRSPValue += qty*num(p.retailPrice);
    totalEffCost += c.stockValue;
    totalListedValue += c.listedStockValue;
    totalMRPValue += c.mrpValue;
  });
  const weightedMarginPct = totalRSPValue>0 ? (totalGP/totalRSPValue*100) : 0;
  const weightedMarkupPct = totalEffCost>0 ? (totalGP/totalEffCost*100) : 0;
  return {weightedMarginPct, weightedMarkupPct, totalGP, totalRSPValue, totalEffCost, totalListedValue, totalMRPValue, totalUnits};
}

function territoryTier(t, doc){
  if(t.canAppoint==="Yes") return {label:"🚫 CRITICAL — company says it can appoint another distributor here",cls:"bad"};
  if(t.type==="Exclusive" && t.agreementMentions==="Yes" && doc && doc.territoryLetter==="Verified") return {label:"✓ BEST — Exclusive + Written in Agreement + Territory letter verified",cls:"good"};
  if(t.type==="Exclusive" && t.agreementMentions==="Yes") return {label:"⚠️ MEDIUM — Exclusive & written in agreement, but territory proof document not yet verified",cls:"warn"};
  if(t.type==="Exclusive") return {label:"⚠️ MEDIUM/HIGH — Exclusive claimed only verbally, not written in agreement",cls:"warn"};
  if(t.type==="Non-exclusive") return {label:"🔴 HIGH RISK — Non-exclusive territory",cls:"bad"};
  return {label:"⚠️ UNCLEAR — territory type not specified",cls:"warn"};
}

/* ---- Negotiation Point Generator: built ONLY from detected weaknesses in entered data, not generic text ---- */
function generateNegotiationPoints(c){
  const points = [];
  const add = (issue,why,ask,preferred,fallback,walkAway)=>points.push({issue,why,ask,preferred,fallback,walkAway});
  const w = weightedMargins(c.products);
  const t=c.territory, inv=c.investment, ret=c.returns, reorder=c.reorder, tgt=c.target, staff=c.staff, marketing=c.marketing, credit=c.credit;

  if(c.products.length && w.weightedMarginPct<12){
    add("Low distributor margin",
      `Weighted margin is only ${pct(w.weightedMarginPct)} — thin margin makes recovery slow and leaves no room for damage/unsold losses.`,
      "Ask for a lower distributor price or a better scheme to raise effective margin.",
      "Margin raised to 15%+ via price/scheme revision.",
      "At least a bigger introductory scheme (extra free units) to offset the thin margin.",
      "If margin stays below 8% with no flexibility, this is not viable — walk away.");
  }
  const total = num(inv.total);
  const unrepresented = total>0 ? Math.max(0,total - w.totalEffCost - (num(inv.branding)+num(inv.registration)+num(inv.transport)+num(inv.deposit)+num(inv.gst)+num(inv.other))) : 0;
  if(unrepresented>1){
    add("Investment not fully represented by stock/charges",
      `${inr(unrepresented)} of the total investment is unaccounted for by inventory or any listed charge.`,
      "Ask the company to itemize exactly what this amount covers.",
      "Full written breakdown provided and it reconciles to the rupee.",
      "Amount reduced from total investment until explained.",
      "If they cannot explain it, treat this as a red flag and do not pay.");
  }
  if(t.type!=="Exclusive" || t.agreementMentions!=="Yes"){
    add("Territory exclusivity not written",
      "Verbal exclusivity claims are not enforceable — another distributor could be appointed in your area later.",
      "Ask for written, signed exclusivity for your district in the agreement itself.",
      "Exclusive rights explicitly named with district boundaries in the agreement.",
      "A written non-compete radius/time period if full exclusivity isn't offered.",
      "If they refuse to put it in writing at all, this is a major risk.");
  }
  if(tgt.failureConsequence==="Compulsory"){
    add("Compulsory target with unclear consequence",
      "A compulsory target with unclear failure consequences creates open-ended liability.",
      "Ask exactly what happens if the target is missed — penalty, termination, or nothing.",
      "Target framed as 'recommended', with no penalty for missing it.",
      "A written cap on any penalty, and a grace period before termination.",
      "If they can't specify the consequence in writing, don't accept a compulsory target.");
  }
  if(ret.expiredReturn!=="Yes" || ret.unsold!=="Yes"){
    add("No expiry/unsold stock return",
      "Without this, all expiry and unsold-stock loss falls on you, even for slow-moving SKUs.",
      "Ask for expired stock replacement and at least partial unsold-stock buyback.",
      "100% replacement for expired stock; unsold stock returnable after a fixed period.",
      "A capped return window (e.g. return up to 10% of stock value per quarter).",
      "If neither is offered on high-value inventory, negotiate the initial order size down instead.");
  }
  if(ret.leakage!=="Yes" && ret.breakage!=="Yes"){
    add("No damage/breakage replacement",
      "Transit and handling damage is common in FMCG/consumer goods distribution.",
      "Ask for a documented leakage/breakage replacement policy with a claim window.",
      "Full replacement within a clear claim window (e.g. 7-15 days) with photo proof.",
      "Partial credit note against next order for verified damage.",
      "If there's no policy at all, factor an extra loss buffer into your margin math.");
  }
  if(/paid/i.test(reorder.transportCharges||"")){
    add("Paid reorder transport",
      "Ongoing transport cost on every reorder erodes margin that looked fine on paper.",
      "Ask for free/discounted transport above a reasonable reorder value.",
      "Free transport above a stated reorder value.",
      "A fixed transport slab instead of per-order variable cost.",
      "If transport cost materially erodes your margin, revisit whether the deal is worth it.");
  }
  if(reorder.moq && /\d{3,}/.test(reorder.moq)){
    add("High reorder MOQ",
      "A high MOQ can force overstocking and cash-flow strain if sales are slower than planned.",
      "Ask if MOQ can be reduced, especially for the first few reorder cycles.",
      "MOQ scaled down for the first 2-3 reorders while you build the market.",
      "Split delivery of the MOQ across two payments/dates.",
      "If MOQ is rigid and large, be conservative about the order value you commit to.");
  }
  if(staff.companySalesman!=="Yes" && marketing.salesmanVisits!=="Free"){
    add("Weak staff/sales support",
      "Without company sales support, all market-building cost and effort falls on you.",
      "Ask for periodic company salesman visits or lead support, even if limited.",
      "Scheduled monthly company salesman visits.",
      "One-time launch support even if ongoing support isn't offered.",
      "Factor the missing support into your own staffing cost estimate.");
  }
  if(!credit.terms){
    add("No credit facility",
      "No credit means you carry full working-capital risk from day one.",
      "Ask for at least short credit terms (7-15 days) on reorders after the first few cycles.",
      "7-15 day credit after a track record of 2-3 timely payments.",
      "A small credit limit even if short-duration.",
      "If no credit is possible at all, size your first order conservatively.");
  }
  if(inv.paymentMethod==="Personal Account"){
    add("Payment requested to personal account",
      "Paying into a personal (not company) account removes legal protection if something goes wrong.",
      "Ask for payment details of the official company bank account only.",
      "Payment made only to the verified company account, against a proper invoice.",
      "None — this is not something to compromise on.",
      "If they insist on a personal account, do not pay. This alone is reason to stop.");
  }
  if(c.documents.distAgreement!=="Verified"){
    add("No verified written agreement",
      "Without a signed agreement, none of the verbal promises made are enforceable.",
      "Ask for the full distributorship agreement before any payment is made.",
      "Signed agreement covering territory, targets, returns, and exit — reviewed before payment.",
      "At minimum a written term sheet, with the full agreement to follow within days.",
      "Do not pay any advance without at least a written term sheet.");
  }
  if(c.documents.territoryLetter!=="Verified" && t.type==="Exclusive"){
    add("Territory letter not verified",
      "An exclusivity claim without a supporting document/letter is just a verbal assurance.",
      "Ask for a specific territory letter naming your district/area.",
      "Signed territory letter attached to the agreement.",
      "Exclusivity clause written directly into the main agreement instead of a separate letter.",
      "If neither is offered, do not treat the territory as protected.");
  }
  if(c.documents.returnPolicyDoc!=="Verified"){
    add("Return policy not documented",
      "An undocumented return policy can be changed or denied later with no recourse.",
      "Ask for the return/damage/expiry policy in writing.",
      "Written return policy attached to the agreement.",
      "Return terms added as a clause in the main agreement.",
      "Without this in writing, budget as if there is no return policy at all.");
  }
  const sim = computeSimulator(c);
  if(c.simulator.monthlySales!=="" && sim.recoveryMonths!=null && sim.recoveryMonths>18){
    add("Long recovery period",
      `At entered assumptions, recovery takes ~${sim.recoveryMonths.toFixed(1)} months — a long payback increases risk exposure.`,
      "Ask for a lower entry investment, better margin, or phased investment.",
      "Recovery period brought under 12 months via better terms.",
      "Phase the investment — pay part now, rest after initial sales validate the market.",
      "If recovery stays beyond 18-24 months with no flexibility, reconsider the investment size.");
  }
  return points;
}

/* ---- Simulator + recovery ---- */
function computeSimulator(c){
  const sim = c.simulator;
  const sales = num(sim.monthlySales);
  const autoMarginPct = weightedMargins(c.products).weightedMarginPct;
  const manualMarginPct = num(sim.grossMarginPct);
  const marginSource = sim.marginSource==="auto" ? "auto" : "manual";
  const marginPct = marginSource==="auto" ? autoMarginPct : manualMarginPct;
  const grossProfit = sales*marginPct/100;
  const expenses = num(sim.transport)+num(sim.salary)+num(sim.petrol)+num(sim.warehouse)+num(sim.phone)+num(sim.marketing)+num(sim.other);
  const netProfit = grossProfit-expenses;
  const investment = num(c.investment.total);
  const recoveryMonths = netProfit>0 ? (investment/netProfit) : null;
  const breakEvenSales = marginPct>0 ? (expenses/(marginPct/100)) : null;
  return {sales,marginPct,autoMarginPct,manualMarginPct,marginSource,grossProfit,expenses,netProfit,investment,recoveryMonths,breakEvenSales};
}
/* Scenario estimate — NOT a forecast. Expenses assumed constant across scenarios. */
function simulateScenario(c, salesMult, marginMult){
  const base = computeSimulator(c);
  const sales = base.sales*salesMult;
  const marginPct = base.marginPct*marginMult;
  const grossProfit = sales*marginPct/100;
  const expenses = base.expenses;
  const netProfit = grossProfit-expenses;
  const recoveryMonths = netProfit>0 ? base.investment/netProfit : null;
  return {sales,marginPct,grossProfit,expenses,netProfit,recoveryMonths};
}
function computeSensitivity(c){
  return {
    "Conservative": simulateScenario(c,0.7,0.85),
    "Base": simulateScenario(c,1,1),
    "Optimistic": simulateScenario(c,1.3,1.1),
  };
}

/* ---- Risk analysis: categorized, severity-weighted, with an explicit FATAL tier ----
   Category weights (visible in UI, part of Score Section too):
   Legal/company verification, Territory protection, Financial transparency = VERY HIGH
   Return/expiry liability = HIGH
   Margin economics = HIGH
   Targets = MEDIUM/HIGH
   Credit = MEDIUM
   Company Support = LOW/MEDIUM
   A single FATAL item overrides everything else — a high score can NOT cancel it out. */
const RISK_CATEGORY_WEIGHT = {
  "Legal & Documentation": "VERY HIGH",
  "Financial Transparency": "VERY HIGH",
  "Territory Protection": "VERY HIGH",
  "Return / Inventory Risk": "HIGH",
  "Product / Margin": "HIGH",
  "Targets & Sales Pressure": "MEDIUM/HIGH",
  "Exit Flexibility": "MEDIUM",
  "Company Support": "LOW/MEDIUM",
};
function computeRiskItems(c){
  const items = [];
  const add = (id,text,severity,category)=>items.push({id,text,severity,category});
  const t=c.territory, inv=c.investment, tgt=c.target, ret=c.returns, reorder=c.reorder, exit=c.exit, doc=c.documents, meta=c.meta;

  // ---- Legal & documentation ----
  if(!meta.legalName || !meta.gstin) add("legal-id","Company legal identity (registered name / GSTIN) cannot be verified","FATAL","Legal & Documentation");
  if(doc.distAgreement!=="Verified") add("agreement","No written distributorship agreement verified","FATAL","Legal & Documentation");
  if(doc.territoryLetter!=="Verified" && t.type==="Exclusive") add("territory-doc","Territory claimed exclusive but no territory letter/proof verified","FATAL","Legal & Documentation");

  // ---- Financial transparency ----
  if(inv.paymentMethod==="Personal Account") add("personal-acct","Payment requested to a personal bank account, not the company's official account","FATAL","Financial Transparency");
  if(inv.gstInvoice!=="Yes" && doc.gstInvoiceDoc!=="Verified") add("no-invoice","No GST invoice confirmed for the purchase","FATAL","Financial Transparency");
  const total = num(inv.total);
  const breakdown = num(inv.inventory)+num(inv.branding)+num(inv.registration)+num(inv.transport)+num(inv.deposit)+num(inv.gst)+num(inv.other);
  if(total>0 && Math.abs(total-breakdown)>=1) add("inv-mismatch",`Investment breakup does not reconcile — ${inr(Math.abs(total-breakdown))} unexplained`,"FATAL","Financial Transparency");
  if(total>0 && inv.deposit && num(inv.deposit)/total>0.3) add("heavy-deposit","Security deposit is a large share (>30%) of total investment","MEDIUM","Financial Transparency");
  if(reorder.price==="") add("reorder-price-unclear","Reorder price not documented","MEDIUM","Financial Transparency");
  if(inv.other && num(inv.other)>0 && !inv.notes) add("hidden-charge","'Other charges' present with no explanation in notes","MEDIUM","Financial Transparency");
  const ps = c.paymentSafety;
  if(ps.notPersonalAccount==="Not Verified") add("ps-personal","Payment Safety checklist: 'not a personal account' is unverified","FATAL","Financial Transparency");
  if(ps.bankNameMatches==="Not Verified") add("ps-bankname","Payment Safety checklist: bank account name is not confirmed to match the legal entity","HIGH","Financial Transparency");
  if(ps.recipientVerified==="Not Verified") add("ps-recipient","Payment Safety checklist: payment recipient not verified","HIGH","Financial Transparency");
  if(ps.agreementReceived==="Not Verified") add("ps-agreement","Payment Safety checklist: distributor agreement not received/reviewed","HIGH","Financial Transparency");
  if(ps.territoryWritten==="Not Verified") add("ps-territory","Payment Safety checklist: territory rights not confirmed in writing","HIGH","Financial Transparency");
  if(ps.finalAmountVerified==="Not Verified") add("ps-amount","Payment Safety checklist: final payable amount not verified","HIGH","Financial Transparency");
  if(ps.investmentBreakupConfirmed==="Not Verified") add("ps-breakup","Payment Safety checklist: investment breakup not confirmed with company","HIGH","Financial Transparency");

  // ---- Territory hierarchy (never mark safe on verbal assurance alone) ----
  if(t.type==="Exclusive" && t.canAppoint==="Yes") add("territory-conflict","Territory claimed exclusive, but company says it CAN appoint another distributor here — direct contradiction","FATAL","Territory Protection");
  else if(t.type==="Exclusive" && t.agreementMentions==="Yes" && doc.territoryLetter==="Verified"){ /* best case: no flag */ }
  else if(t.type==="Exclusive" && t.agreementMentions!=="Yes") add("territory-verbal","Exclusivity claimed only verbally — not written in the agreement","HIGH","Territory Protection");
  else if(t.type==="Non-exclusive") add("territory-nonexcl","Territory is explicitly non-exclusive","HIGH","Territory Protection");
  else add("territory-unclear","Territory protection status is not clear","HIGH","Territory Protection");
  if(t.directSells==="Yes") add("direct-sell","Company sells directly within your claimed territory","MEDIUM","Territory Protection");
  if(t.onlineSales==="Yes") add("online-sell","Online sales compete within your claimed territory","MEDIUM","Territory Protection");

  // ---- Return / inventory risk ----
  if(ret.expiredReturn!=="Yes") add("expired-return", ret.expiredReturn==="Conditional"?"Expired stock return is conditional only":"No replacement/return for expired stock","HIGH","Return / Inventory Risk");
  if(ret.unsold!=="Yes") add("unsold-return", ret.unsold==="Conditional"?"Unsold stock return is conditional only":"Unsold stock will not be taken back","MEDIUM","Return / Inventory Risk");
  if(ret.leakage!=="Yes" && ret.breakage!=="Yes") add("damage-unclear","Leakage/breakage replacement is not confirmed","MEDIUM","Return / Inventory Risk");
  if(ret.nearExpiry==="No") add("near-expiry","Near-expiry stock will not be replaced","MEDIUM","Return / Inventory Risk");
  if(ret.slowMoving!=="Yes") add("slow-moving","No return provision for slow-moving stock","LOW","Return / Inventory Risk");
  if(!ret.claimWindow) add("claim-window","Claim window for damage/return is not documented — verification required","MEDIUM","Return / Inventory Risk");

  // ---- Product / margin economics (uses weighted margin, not a simple average) ----
  if(c.products.length===0){
    add("no-products","No product-wise stock/price data entered yet — real margin unknown","HIGH","Product / Margin");
  } else {
    const w = weightedMargins(c.products);
    if(w.weightedMarginPct < 8) add("low-margin",`Weighted distributor margin is very low (${pct(w.weightedMarginPct)})`,"HIGH","Product / Margin");
    else if(w.weightedMarginPct < 12) add("thin-margin",`Weighted distributor margin is thin (${pct(w.weightedMarginPct)})`,"MEDIUM","Product / Margin");
    const gstUnclear = c.products.filter(p=>computeEffectivePrice(p).gstUnknown).length;
    if(gstUnclear>0) add("gst-unclear",`GST treatment unclear on ${gstUnclear} product(s) — margin cannot be fully confirmed`,"MEDIUM","Product / Margin");
  }

  // ---- Targets & sales pressure ----
  if(tgt.failureConsequence==="Compulsory") add("target-compulsory","Monthly target is compulsory (high sales pressure)","MEDIUM","Targets & Sales Pressure");
  if(reorder.moq && /\d{3,}/.test(reorder.moq)) add("moq-high","Reorder MOQ looks high — verify before committing","MEDIUM","Targets & Sales Pressure");

  // ---- Exit flexibility ----
  if(exit.canCancel==="Not Clear" || !exit.terminationTerms) add("exit-unclear","Exit / termination terms are not clear","MEDIUM","Exit Flexibility");
  if(exit.depositRefund==="No") add("deposit-no-refund","Security deposit is explicitly non-refundable on exit","MEDIUM","Exit Flexibility");

  // ---- Company support / reference ----
  if(!meta.existName || !meta.existPhone) add("no-reference","No existing-distributor reference obtained to cross-check claims","LOW","Company Support");

  return items;
}
/* Legacy-compatible wrapper used across dashboard/comparison/decision code */
function computeRiskFlags(c){
  const items = computeRiskItems(c);
  return { flags: items.map(i=>i.text), items, hasFatal: items.some(i=>i.severity==="FATAL") };
}
function riskLevelFromItems(items){
  if(items.some(i=>i.severity==="FATAL")) return {key:"VERYHIGH",label:"FATAL RISK"};
  const high = items.filter(i=>i.severity==="HIGH").length;
  const med = items.filter(i=>i.severity==="MEDIUM").length;
  const weighted = high*3 + med*1;
  if(weighted<=1) return {key:"LOW",label:"LOW RISK"};
  if(weighted<=4) return {key:"MEDIUM",label:"MEDIUM RISK"};
  if(weighted<=8) return {key:"HIGH",label:"HIGH RISK"};
  return {key:"VERYHIGH",label:"VERY HIGH RISK"};
}
function riskLevel(items_or_count){
  // backward-compatible: accepts either an items array or a legacy flag count
  if(Array.isArray(items_or_count)) return riskLevelFromItems(items_or_count);
  const n = items_or_count;
  if(n<=2) return {key:"LOW",label:"LOW RISK"};
  if(n<=5) return {key:"MEDIUM",label:"MEDIUM RISK"};
  if(n<=9) return {key:"HIGH",label:"HIGH RISK"};
  return {key:"VERYHIGH",label:"VERY HIGH RISK"};
}

  <div style="margin-top:8px;">

      <div class="section-title" style="margin-top:16px;color:var(--${sevMeta[s].cls});">${sevMeta[s].label} (${bySeverity[s].length})</div>
      ${bySeverity[s].map(i=>`<div class="flag-item"><div class="flag-dot" style="background:var(--${sevMeta[s].cls});"></div><span>${esc(i.text)} <span style="color:var(--ink-faint);font-weight:600;">— ${esc(i.category)}</span></span></div>`).join("")}

/* ---- Score ---- */
/* 10-category weighted score. A high total is NEVER allowed to override a FATAL risk —
   that check lives in finalDecision(), the score itself just reports honestly. */
function computeScore(c){
  const products = c.products;
  const w = weightedMargins(products);
  const total = num(c.investment.total);
  const breakdown = num(c.investment.inventory)+num(c.investment.branding)+num(c.investment.registration)+num(c.investment.transport)+num(c.investment.deposit)+num(c.investment.gst)+num(c.investment.other);
  const reconciled = total>0 && Math.abs(total-breakdown)<1;
  const docPct = docVerificationPct(c);
  const riskItems = computeRiskItems(c);
  const hasFatal = riskItems.some(i=>i.severity==="FATAL");

  const marginComponent = Math.max(0,Math.min(10, w.weightedMarginPct/2.5)); // 25% weighted margin = 10/10
  const gstKnownFraction = products.length ? products.filter(p=>!computeEffectivePrice(p).gstUnknown).length/products.length : 0;

  const financialEconomics = marginComponent*0.5 + (reconciled?10:(total>0?0:5))*0.5;
  const productMargin = marginComponent*0.7 + (gstKnownFraction*10)*0.3;
  const t = c.territory;
  const territoryProtection = t.canAppoint==="Yes" ? 0 :
    (t.type==="Exclusive" && t.agreementMentions==="Yes" && c.documents.territoryLetter==="Verified") ? 10 :
    (t.type==="Exclusive" && t.agreementMentions==="Yes") ? 7 :
    t.type==="Exclusive" ? 5 : t.type==="Non-exclusive" ? 2 : 1;
  let legalDocs = docPct/10;
  if(c.documents.distAgreement!=="Verified") legalDocs = Math.min(legalDocs,4);
  if(!c.meta.legalName || !c.meta.gstin) legalDocs = Math.min(legalDocs,2);
  let returnCount=0;
  ["leakage","breakage","mfgDefect","nearExpiry","expiredReturn","slowMoving","unsold"].forEach(k=>{ if(c.returns[k]==="Yes") returnCount++; });
  const returnRisk = Math.min(10, returnCount*(10/7));
  let targetsPressure = 10;
  if(c.target.failureConsequence==="Compulsory") targetsPressure -= 4;
  if(c.reorder.moq && /\d{3,}/.test(c.reorder.moq)) targetsPressure -= 3;
  targetsPressure = Math.max(0,targetsPressure);
  const companySupport = c.scores.marketingSup*0.7 + ((c.meta.existName&&c.meta.existPhone)?10:3)*0.3;
  let creditCashFlow = c.scores.creditTerms;
  if(c.investment.paymentMethod==="Personal Account") creditCashFlow -= 4;
  if(c.credit.terms==="Cash") creditCashFlow -= 2;
  creditCashFlow = Math.max(0,Math.min(10,creditCashFlow));
  const exitFlexibility = (c.exit.canCancel==="Yes"?4:0) + (c.exit.depositRefund==="Yes"?3:c.exit.depositRefund==="Conditional"?1.5:0) + (c.exit.stockReturn==="Yes"?3:c.exit.stockReturn==="Conditional"?1.5:0);
  const overallReliability = c.scores.reliability*0.6 + (docPct/10)*0.4;

  const weighted = {
    "Financial Economics": {w:15, s:financialEconomics, category:"Financial Economics"},
    "Product / Margin": {w:15, s:productMargin, category:"Product / Margin"},
    "Territory Protection": {w:15, s:territoryProtection, category:"Territory Protection"},
    "Legal & Documentation": {w:15, s:legalDocs, category:"Legal & Documentation"},
    "Return / Inventory Risk": {w:10, s:returnRisk, category:"Return / Inventory Risk"},
    "Targets & Sales Pressure": {w:8, s:targetsPressure, category:"Targets & Sales Pressure"},
    "Company Support": {w:7, s:companySupport, category:"Company Support"},
    "Credit / Cash Flow": {w:7, s:creditCashFlow, category:"Credit / Cash Flow"},
    "Exit Flexibility": {w:5, s:exitFlexibility, category:"Exit Flexibility"},
    "Overall Reliability": {w:3, s:overallReliability, category:"Overall Reliability"},
  };
  let total100=0;
  Object.values(weighted).forEach(v=>{ total100 += (v.s/10)*v.w; });
  return {weighted, total:Math.round(total100), hasFatal, docPct, reconciled};
}
function renderScoreSection(){
  const c = curCompany();
  const {weighted, total, hasFatal, docPct} = computeScore(c);
  return `

/* ---------- CSV import (robust: quoted fields, embedded commas, header validation) ---------- */
let csvImportState = null; // transient, not persisted
function parseCSV(text){
  const rows=[]; let row=[]; let field=''; let inQuotes=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQuotes){
      if(ch==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQuotes=false; }
      else field+=ch;
    } else {
      if(ch==='"') inQuotes=true;
      else if(ch===','){ row.push(field); field=''; }
      else if(ch==='\r'){ /* ignore, \n handles line break */ }
      else if(ch==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field+=ch;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => !(r.length===1 && r[0].trim()===""));
}
const PRODUCT_CSV_V2_HEADERS = ["Company","Product","Category","Pack Size","Qty","MRP","Listed Distributor Price","GST %","GST Type","Scheme Type","Scheme Value","Retailer Selling Price"];
function detectCsvType(headers){
  const h = headers.map(x=>x.trim());
  if(h.includes("GSTIN") && h.includes("Legal Name")) return "comparison";
  if(h.includes("Product") && (h.includes("MRP")||h.includes("Distributor Price")||h.includes("Listed Distributor Price"))) return "product";
  return "unknown";
}
function handleCsvFile(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const rows = parseCSV(String(reader.result));
      if(rows.length<2){ csvImportState={error:"CSV file has no data rows."}; render(); return; }
      const headers = rows[0];
      const type = detectCsvType(headers);
      if(type==="unknown"){ csvImportState={error:"Could not recognize CSV headers. Use a file exported by this app (Product CSV or Full Comparison CSV)."}; render(); return; }
      const dataRows = rows.slice(1);
      const errors = [];
      const parsedRows = [];
      dataRows.forEach((r,i)=>{
        if(r.length!==headers.length){ errors.push(`Row ${i+2}: column count mismatch (${r.length} vs ${headers.length}) — skipped`); return; }
        const obj = {};
        headers.forEach((h,j)=>obj[h.trim()]=r[j]);
        if(type==="product"){
          if(obj["Qty"]!==undefined && obj["Qty"]!=="" && isNaN(parseFloat(obj["Qty"]))){ errors.push(`Row ${i+2}: invalid Qty "${obj["Qty"]}" — skipped`); return; }
          if(obj["MRP"]!==undefined && obj["MRP"]!=="" && isNaN(parseFloat(obj["MRP"]))){ errors.push(`Row ${i+2}: invalid MRP "${obj["MRP"]}" — skipped`); return; }
        }
        parsedRows.push(obj);
      });
      csvImportState = {type, headers, rows:parsedRows, errors, fileName:file.name, target:null, mode:"append"};
      render();
    }catch(e){
      csvImportState = {error:"Failed to parse this file: "+e.message};
      render();
    }
  };
  reader.onerror = ()=>{ csvImportState={error:"Could not read the file."}; render(); };
  reader.readAsText(file);
}
function applyCsvImport(){
  const st = csvImportState;
  if(!st || !st.target) return;
  const c = st.target==="c1" ? state.c1 : state.c2;
  let importedCount = 0;
  if(st.type==="product"){
    const isV2 = st.headers.includes("Listed Distributor Price") || st.headers.includes("GST Type");
    const newProducts = st.rows.map(obj=>{
      const p = {id:uid(),name:obj["Product"]||"",category:obj["Category"]||"",packSize:obj["Pack Size"]||"",
        qty:obj["Qty"]||"", mrp:obj["MRP"]||"", distPrice:obj[isV2?"Listed Distributor Price":"Distributor Price"]||"",
        gstPct:obj["GST %"]||obj["GST%"]||"", gstType:obj["GST Type"]||"Unknown",
        schemeType: obj["Scheme Type"]||"None", scheme: obj["Scheme"]||obj["Scheme Value"]||"",
        schemePct:"",schemeFlat:"",schemeFreeUnits:"",schemeBuyX:"",schemeGetY:"",
        retailPrice: obj["Retailer Selling Price"]||""};
      if(p.schemeType==="Percentage") p.schemePct = obj["Scheme Value"]||"";
      if(p.schemeType==="Flat") p.schemeFlat = obj["Scheme Value"]||"";
      if(p.schemeType==="Free Units") p.schemeFreeUnits = obj["Scheme Value"]||"";
      if(p.schemeType==="Buy X Get Y" && obj["Scheme Value"] && obj["Scheme Value"].includes("/")){
        const [x,y] = obj["Scheme Value"].split("/"); p.schemeBuyX=x; p.schemeGetY=y;
      }
      return p;
    });
    if(st.mode==="replace") c.products = newProducts; else c.products = c.products.concat(newProducts);
    importedCount = newProducts.length;
  } else if(st.type==="comparison"){
    const row = st.rows.find(r=>r["Company"]===c.name) || st.rows[0];
    if(row){
      if(row["Legal Name"]) c.meta.legalName = row["Legal Name"];
      if(row["GSTIN"]) c.meta.gstin = row["GSTIN"];
      if(row["Investment"]) c.investment.total = row["Investment"];
      if(row["District"]) c.territory.district = row["District"];
      if(row["Territory Type"]) c.territory.type = row["Territory Type"];
      if(row["Monthly Target"]) c.target.monthly = row["Monthly Target"];
      if(row["Quarterly Target"]) c.target.quarterly = row["Quarterly Target"];
      if(row["Annual Target"]) c.target.annual = row["Annual Target"];
      if(row["Reorder MOQ"]) c.reorder.moq = row["Reorder MOQ"];
      if(row["Reorder Price"]) c.reorder.price = row["Reorder Price"];
      if(row["Credit Terms"]) c.credit.terms = row["Credit Terms"];
      importedCount = 1;
    }
  }
  scheduleSave();
  showToast(`Imported ${importedCount} record(s) into ${esc(c.name)}`);
  csvImportState = null;
  render();
}

/* ================= FINAL DECISION ================= */
/* Priority order per spec Part 42:
   1. Critical data incomplete  2. Fatal risk  3. Critical documents missing
   4. Economics negative  5. Territory not protected  6. Risk/score.
   A high score can NEVER promote a company past a FATAL risk or missing critical docs. */
const DECISION_RANK = {"DATA INCOMPLETE":0,"DO NOT INVEST YET":1,"HIGH RISK — AVOID":2,"NEGOTIATE FIRST":3,"INVEST AFTER VERIFICATION":4,"INVEST":5};
const CRITICAL_DOCS = [["distAgreement","Distributorship Agreement"],["returnPolicyDoc","Return Policy"],["gstInvoiceDoc","GST Invoice"]];
function companyDecision(c){
  const reasons = [];
  const items = computeRiskItems(c);
  const hasFatal = items.some(i=>i.severity==="FATAL");
  const dataComplete = num(c.investment.total)>0 && c.products.length>0 && !!c.meta.legalName;
  const missingCriticalDocs = CRITICAL_DOCS.filter(([k])=>c.documents[k]!=="Verified").map(([,label])=>label);
  const t = c.territory;
  const territoryOk = t.canAppoint!=="Yes" && (t.type==="Exclusive"?t.agreementMentions==="Yes":false);
  const territoryCritical = t.canAppoint==="Yes";
  const sim = computeSimulator(c);
  const economicsNegative = c.simulator.monthlySales!=="" && sim.netProfit<=0;
  const {total:score} = computeScore(c);
  const level = riskLevelFromItems(items);

  let decision;
  if(!dataComplete){
    decision = "DATA INCOMPLETE";
    reasons.push("Investment, product/stock data, or company legal name is not yet fully entered.");
  } else if(hasFatal){
    decision = "DO NOT INVEST YET";
    items.filter(i=>i.severity==="FATAL").forEach(i=>reasons.push("FATAL: "+i.text));
  } else if(territoryCritical){
    decision = "DO NOT INVEST YET";
    reasons.push("Company says it can appoint another distributor in your claimed territory — direct contradiction of exclusivity.");
  } else if(missingCriticalDocs.length>0){
    decision = "INVEST AFTER VERIFICATION";
    reasons.push("Critical documents not verified: "+missingCriticalDocs.join(", "));
  } else if(economicsNegative){
    decision = "HIGH RISK — AVOID";
    reasons.push("At entered sales/margin/expense assumptions, net operating profit is zero or negative.");
  } else if(!territoryOk){
    decision = "NEGOTIATE FIRST";
    reasons.push("Territory protection is not fully confirmed in writing.");
  } else if(level.key==="HIGH"||level.key==="VERYHIGH"){
    decision = "NEGOTIATE FIRST";
    reasons.push(`Risk level is ${level.label} — resolve open points before paying.`);
  } else {
    decision = "INVEST";
    reasons.push(`Territory protected, critical documents verified, economics viable, risk level ${level.label}.`);
  }
  reasons.push(`Score: ${score}/100 (informational — does not override the checks above)`);
  return {decision, reasons, hasFatal, missingCriticalDocs, score, level, items};
}
function finalDecision(){
  const c1=state.c1, c2=state.c2;
  const d1 = companyDecision(c1), d2 = companyDecision(c2);
  const r1 = DECISION_RANK[d1.decision], r2 = DECISION_RANK[d2.decision];

  let decision, reasons=[], pendingItems=[], style;
  const bothUninvestable = r1<=1 && r2<=1; // DATA INCOMPLETE or DO NOT INVEST YET for both
  if(d1.decision==="DATA INCOMPLETE" && d2.decision==="DATA INCOMPLETE"){
    decision = "DATA INCOMPLETE"; style="bad";
    reasons.push("Complete both companies' data first — investment, products and company legal name at minimum.");
  } else if(bothUninvestable){
    decision = "NEITHER — Abhi invest mat karo"; style="bad";
    reasons.push(`${c1.name}: ${d1.decision} — ${d1.reasons[0]||""}`);
    reasons.push(`${c2.name}: ${d2.decision} — ${d2.reasons[0]||""}`);
    reasons.push("Both opportunities have unacceptable risk right now.");
  } else {
    const better = r1>=r2 ? c1 : c2;
    const betterD = r1>=r2 ? d1 : d2;
    const worseD = r1>=r2 ? d2 : d1;
    decision = `${better.name} — ${betterD.decision}`;
    style = betterD.decision==="INVEST"||betterD.decision==="INVEST AFTER VERIFICATION" ? "good":"bad";
    betterD.reasons.forEach(r=>reasons.push(`${better.name}: ${r}`));
    if(r1===r2) reasons.push(`Both at same decision tier — ${better.name} chosen on higher score (${betterD.score} vs ${worseD.score}).`);
    reasons.push(`Comparison: ${(r1>=r2?c2:c1).name} is ${worseD.decision.toLowerCase()} at this stage.`);
  }

  [c1,c2].forEach(c=>{
    if(c.documents.distAgreement!=="Verified") pendingItems.push(`${c.name}: Agreement not verified`);
    if(c.documents.returnPolicyDoc!=="Verified") pendingItems.push(`${c.name}: Return policy document not verified`);
    if(c.documents.gstInvoiceDoc!=="Verified" && c.investment.gstInvoice!=="Yes") pendingItems.push(`${c.name}: GST invoice not confirmed`);
    if(c.territory.agreementMentions!=="Yes") pendingItems.push(`${c.name}: Territory not verified in writing`);
    if(c.products.length===0) pendingItems.push(`${c.name}: Stock list missing`);
    if(c.returns.unsold==="Not Clear"||c.returns.unsold==="") pendingItems.push(`${c.name}: Return policy missing/unclear`);
    if(c.investment.paymentMethod==="Personal Account") pendingItems.push(`${c.name}: Payment account is personal, not company — verify authorization`);
  });

  return {decision, reasons, pendingItems, style, d1, d2, score1:d1.score, score2:d2.score};
}
function renderFinalDecision(){
  const {decision, reasons, pendingItems, style} = finalDecision();
  return `
  <div class="section-title">Final Decision</div>
